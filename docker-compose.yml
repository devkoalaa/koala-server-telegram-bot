# Production stack on the koala-server. BOT_TOKEN, ALLOWED_CHAT_ID and the
# KOALA_FIT_*DATABASE_URL vars come from BOT_ENV_FILE (set by the deploy workflow to
# ~/apps/koala-server-telegram-bot/.env on the server) or a local .env.
services:
  bot:
    build: .
    image: koala-server-telegram-bot:latest
    container_name: koala-server-telegram-bot
    restart: unless-stopped
    env_file: ${BOT_ENV_FILE:-.env}
    environment:
      TZ: America/Sao_Paulo
    ports:
      # Internal /notify endpoint for deploy workflows and the backup timer.
      - "127.0.0.1:8081:8081"
    volumes:
      # Read/write: /restart needs to call the Docker API.
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/ubuntu/backups/local:/backups:ro
      # Keys pinned on the host to ~/bin/claude-telegram (/claude, read-only)
      # and ~/bin/claude-scale (scale reports).
      - /home/ubuntu/apps/koala-server-telegram-bot/ssh:/ssh:ro
      # Scale report images (kept 30 days), read by ~/bin/claude-scale.
      - /home/ubuntu/apps/koala-server-telegram-bot/scale-reports:/scale-reports
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [db]

networks:
  # Shared with the postgres container (~/apps/postgres).
  db:
    external: true
